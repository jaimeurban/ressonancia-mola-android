name: Gerar APK nativo da mola
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto Kotlin
        run: unzip -q codigo-fonte-mola.zip
      - name: Compilar APK
        run: gradle --no-daemon -p RessonanciaMolaNativa :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Mola-Longitudinal-APK-Nativo
          path: RessonanciaMolaNativa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
